name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      api-level: ${{ steps.android.outputs.api-level }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI routing, protocol and publication contracts
        run: |
          python3 scripts/test-latest-stable-android.py
          python3 scripts/test-instrumentation-smoke.py
          python3 scripts/test-lifecycle-suite.py
          python3 scripts/test_ci_device.py
          bash scripts/test-verify-ci-status.sh
          bash scripts/test-version-resolution.sh
          bash scripts/test-handle-pr-comment.sh
      - name: Resolve validated Android image
        id: android
        run: |
          python3 - <<'PY'
          import json, os
          api = json.load(open('ci/device-suites.json'))['api']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f'api-level={api}\n')
          print(f'Validated Google APIs x86_64 image: API {api}')
          PY

  unit-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - run: sudo install -d -m 0777 /opt/cursor/artifacts
      - name: Unit tests
        run: ./gradlew testDebugUnitTest :bank-engine:test :finance-core:test :ml-assist:test --stacktrace
      - name: Preserve complete unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            ui-kit/build/reports/tests/
            app/build/reports/tests/
            bank-engine/build/reports/tests/
            finance-core/build/reports/tests/
            ml-assist/build/reports/tests/
          if-no-files-found: error
      - name: Verify trained model reproducibility
        run: |
          python3 ml-assist/tools/test_train_family_model.py
          python3 ml-assist/tools/train_family_model.py --check --skip-export
          python3 ml-assist/tools/test_training.py
          ./gradlew :ml-assist:trainRecurringSeed -PrecurringCheck=true --console=plain

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Lint and detekt
        run: ./gradlew lintDebug detekt --stacktrace

  build-test-apks:
    needs: android-version
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Build shared test APKs
        run: bash scripts/app-apk-upgrade.sh build
      - name: Bundle exact APKs, provenance and balanced test plan
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci_device.py bundle
      - uses: actions/upload-artifact@v4
        with:
          name: shared-test-apks
          path: app/build/ci-device/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  emulator-app:
    needs: [android-version, build-test-apks]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-test-apks
          path: app/build/ci-device/
      - name: Resolve SDK cache path
        id: sdk
        run: echo "root=${ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"
      - name: Cache Android system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.root }}/system-images/android-${{ needs.android-version.outputs.api-level }}/google_apis/x86_64
          key: android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.android-version.outputs.api-level }}-google_apis-x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.android-version.outputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            # API 36 Google services still initialize after sys.boot_completed.
            # Let the fresh image settle before testing normal application startup.
            sleep 45
            python3 scripts/ci_device.py run --shard ${{ matrix.shard }}
      - name: Preserve per-case evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports-${{ matrix.shard }}
          path: app/build/reports/device-ci/
          if-no-files-found: error

  emulator-recovery:
    needs: [android-version, build-test-apks]
    strategy:
      fail-fast: false
      matrix:
        suite: [production, upgrade]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: actions/download-artifact@v4
        with:
          name: shared-test-apks
          path: app/build/ci-device/
      - name: Restore checked APK paths without compiling
        run: python3 scripts/ci_device.py restore
      - name: Resolve SDK cache path
        id: sdk
        run: echo "root=${ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"
      - name: Cache Android system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.root }}/system-images/android-${{ needs.android-version.outputs.api-level }}/google_apis/x86_64
          key: android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.android-version.outputs.api-level }}-google_apis-x86_64
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Process-death instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CI_DEVICE_BUNDLE: app/build/ci-device
        with:
          api-level: ${{ needs.android-version.outputs.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            sleep 45
            bash .github/scripts/run-lifecycle-suite.sh ${{ matrix.suite }} test
      - name: Preserve recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifecycle-reports-${{ matrix.suite }}
          path: app/build/reports/device-ci/
          if-no-files-found: error

  emulator-lifecycle:
    needs: emulator-recovery
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every recovery suite
        env:
          RECOVERY_RESULT: ${{ needs.emulator-recovery.result }}
        run: test "$RECOVERY_RESULT" = success

  emulator-smoke:
    needs: [android-version, build-test-apks, unit-test, static-analysis, emulator-app, emulator-lifecycle]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require complete CI
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = {name: job['result'] for name, job in results.items() if job['result'] != 'success'}
          if failed: raise SystemExit(f'Incomplete CI: {failed}')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: instrumentation-reports-*
          path: device-results
      - name: Require statement reconciliation screenshots
        run: find device-results -name 'm19-*.png' | grep -q .
