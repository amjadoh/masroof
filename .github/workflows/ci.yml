name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api-level: ${{ steps.android.outputs.api-level }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test stable-image selection
        run: python3 scripts/test-latest-stable-android.py
      - name: Test device-suite routing and failure reporting
        run: python3 scripts/test-instrumentation-smoke.py
      - name: Resolve latest stable Android emulator image
        id: android
        run: python3 scripts/latest-stable-android.py

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure local SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            ui-kit/build/reports/tests/
            app/build/reports/tests/
            lab/beta/build/reports/tests/
            lab/beta/build/reports/beta-interpretation/
          if-no-files-found: warn

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure local SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Lint and detekt
        run: ./gradlew lintDebug detekt :lab:upgrade-host:lintAfterDebug --stacktrace

  # AndroidJUnitRunner partitions the complete production suite across two devices.
  # Keep fail-fast disabled so a failure never cancels the other half's diagnostics.
  emulator-app:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    needs: android-version
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure local SDK path
        id: sdk
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "root=${ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"

      # Cache SDK files only. Each job still boots a clean, independent AVD.
      - name: Cache Android system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.root }}/system-images/android-${{ needs.android-version.outputs.api-level }}/google_apis/x86_64
          key: android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.android-version.outputs.api-level }}-google_apis-x86_64

      # Compile without a running emulator competing for runner CPU and memory.
      - name: Assemble production device tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.android-version.outputs.api-level }}
          target: google_apis
          arch: x86_64
          # The generic 320x640 AVD cannot exercise the 1600x2000 unfolded window.
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash .github/scripts/run-instrumentation-smoke.sh app ${{ matrix.shard }} 2

      - name: Upload statement reconciliation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m19-statement-screenshots-${{ matrix.shard }}
          path: m19-statement-screenshots
          if-no-files-found: warn

      - name: Upload instrumentation reports and per-test window diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports-${{ matrix.shard }}
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
          if-no-files-found: warn

  # Preserve the smoke check and require screenshots across the combined shards.
  emulator-smoke:
    needs: emulator-app
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require both production shards
        env:
          SHARDS_RESULT: ${{ needs.emulator-app.result }}
        run: test "$SHARDS_RESULT" = success
      - uses: actions/download-artifact@v4
        with:
          pattern: m19-statement-screenshots-*
          path: m19-statement-screenshots
          merge-multiple: true
      - name: Require statement screenshots
        run: find m19-statement-screenshots -name 'm19-*.png' | grep -q .

  emulator-beta:
    needs: android-version
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure local SDK path
        id: sdk
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "root=${ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"

      # Cache SDK files only. Each job still boots a clean, independent AVD.
      - name: Cache Android system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.root }}/system-images/android-${{ needs.android-version.outputs.api-level }}/google_apis/x86_64
          key: android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.android-version.outputs.api-level }}-google_apis-x86_64

      # Compile without a running emulator competing for runner CPU and memory.
      - name: Assemble Beta device tests
        run: ./gradlew :lab:beta:assembleDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.android-version.outputs.api-level }}
          target: google_apis
          arch: x86_64
          # The generic 320x640 AVD cannot exercise the 1600x2000 unfolded window.
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash .github/scripts/run-instrumentation-smoke.sh beta

      - name: Upload Beta instrumentation reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-instrumentation-reports
          path: |
            lab/beta/build/reports/androidTests/connected/debug/
            lab/beta/build/outputs/androidTest-results/connected/debug/
            beta-dashboard-screenshots/
          if-no-files-found: warn

  # The full Beta suite has its own device; stateful halt/resume pairs stay together.
  emulator-lifecycle:
    needs: android-version
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure local SDK path
        id: sdk
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
          echo "root=${ANDROID_SDK_ROOT}" >> "$GITHUB_OUTPUT"

      # Cache SDK files only. Each job still boots a clean, independent AVD.
      - name: Cache Android system image
        uses: actions/cache@v4
        with:
          path: ${{ steps.sdk.outputs.root }}/system-images/android-${{ needs.android-version.outputs.api-level }}/google_apis/x86_64
          key: android-image-v1-${{ runner.os }}-${{ runner.arch }}-${{ needs.android-version.outputs.api-level }}-google_apis-x86_64

      - name: Assemble lifecycle and Beta device tests
        run: >-
          ./gradlew :lab:beta:assembleDebugAndroidTest :app:assembleDebug :app:assembleDebugAndroidTest
          :lab:upgrade-host:assembleBeforeDebug :lab:upgrade-host:assembleAfterDebug
          :lab:upgrade-host:assembleBeforeDebugAndroidTest :lab:upgrade-host:assembleAfterDebugAndroidTest --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Process-death instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.android-version.outputs.api-level }}
          target: google_apis
          arch: x86_64
          # Keep the same device geometry for the permission and recovery journeys.
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "sdk.dir=${SDK_DIR}" > local.properties
            adb install -r -t lab/beta/build/outputs/apk/androidTest/debug/beta-debug-androidTest.apk
            bash scripts/beta-process-death.sh
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            # RestoreConcurrencyTest already runs in the production shards.
            bash scripts/m13-process-death.sh
            bash scripts/beta-apk-upgrade.sh
      - name: Upload synthetic signed-update and performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-upgrade-diagnostics
          path: beta-upgrade-diagnostics/
          if-no-files-found: warn
      - name: Upload isolated Beta permission dialog diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-permission-dialog-diagnostics
          path: beta-permission-diagnostics/
          if-no-files-found: warn

  # The API 26-28 pre-VACUUM backup device job is intentionally retired from CI.
  # Its test and production fallback remain in the repository for later cleanup.
