name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api-level: ${{ steps.android.outputs.api-level }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test stable-image selection
        run: python3 scripts/test-latest-stable-android.py
      - name: Resolve latest stable Android emulator image
        id: android
        run: python3 scripts/latest-stable-android.py

  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure local SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload Android unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-reports
          path: |
            ui-kit/build/reports/tests/
            app/build/reports/tests/
            lab/beta/build/reports/tests/
            lab/beta/build/reports/beta-interpretation/
          if-no-files-found: warn

  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure local SDK path
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties

      - name: Lint and detekt
        run: ./gradlew lintDebug detekt :lab:upgrade-host:lintAfterDebug --stacktrace

  # Device smoke for the hardening journeys. JVM unit tests stay the fast PR gate.
  # This job is isolated so an emulator failure does not rewrite production behavior.
  emulator-smoke:
    needs: android-version
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumentation smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.android-version.outputs.api-level }}
          target: google_apis
          arch: x86_64
          # The generic 320x640 AVD cannot exercise the 1600x2000 unfolded window.
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash .github/scripts/run-beta-instrumentation-smoke.sh

      - name: Upload statement reconciliation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m19-statement-screenshots
          path: m19-statement-screenshots
          if-no-files-found: warn

      - name: Upload instrumentation reports and per-test window diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-reports
          path: |
            app/build/reports/androidTests/connected/debug/
            app/build/outputs/androidTest-results/connected/debug/
            lab/beta/build/reports/androidTests/connected/debug/
            lab/beta/build/outputs/androidTest-results/connected/debug/
            beta-dashboard-screenshots/
          if-no-files-found: warn

  # Separate from emulator-smoke so clearPackageData=true cannot wipe the database
  # between the halt and the restarted process. Both jobs use the same stable API.
  emulator-lifecycle:
    needs: android-version
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.users.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Process-death instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.android-version.outputs.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            echo "sdk.dir=${SDK_DIR}" > local.properties
            # Run the independent Beta permission/lifecycle gate first; each journey still runs once.
            ./gradlew :lab:beta:assembleDebugAndroidTest --stacktrace
            adb install -r -t lab/beta/build/outputs/apk/androidTest/debug/beta-debug-androidTest.apk
            bash scripts/beta-process-death.sh
            ./gradlew :app:installDebug :app:installDebugAndroidTest --stacktrace
            # RestoreConcurrencyTest already runs in emulator-smoke.
            bash scripts/m13-process-death.sh
            ./gradlew :lab:upgrade-host:assembleBeforeDebug :lab:upgrade-host:assembleAfterDebug :lab:upgrade-host:assembleBeforeDebugAndroidTest :lab:upgrade-host:assembleAfterDebugAndroidTest --stacktrace
            bash scripts/beta-apk-upgrade.sh
      - name: Upload synthetic signed-update and performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-upgrade-diagnostics
          path: beta-upgrade-diagnostics/
          if-no-files-found: warn
      - name: Upload isolated Beta permission dialog diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-permission-dialog-diagnostics
          path: beta-permission-diagnostics/
          if-no-files-found: warn

  # The API 26-28 pre-VACUUM backup device job is intentionally retired from CI.
  # Its test and production fallback remain in the repository for later cleanup.
