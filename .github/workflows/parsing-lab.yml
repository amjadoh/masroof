name: Parsing Lab
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/masroof-parsing-lab]
permissions:
  contents: read
concurrency:
  group: parsing-lab-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  isolated-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Configure SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Verify experiment scoring and review guards (no model download)
        run: python3 -m unittest discover -s parsing-lab/experiments -p 'test_*.py'
      - name: Test cloned baseline, dynamic engine, database isolation and host
        run: ./gradlew :parsing-lab:engine:test :parsing-lab:android:testDebugUnitTest :app:testDebugUnitTest --stacktrace
      - name: Build Masroof with integrated parsing lab
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: masroof-parsing-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parsing-lab-test-reports
          path: |
            parsing-lab/engine/build/reports/tests/
            parsing-lab/android/build/reports/tests/
