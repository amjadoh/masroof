name: Lab
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/masroof-lab]
permissions:
  contents: read
concurrency:
  group: lab-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  isolated-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
      - name: Configure SDK
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      # CI's root testDebugUnitTest task covers app and lab/beta.
      # Pure JVM modules have separate test tasks and run only here.
      - name: Test lab JVM engines and domain contracts
        run: ./gradlew :lab:finance-core:test :lab:bank-engine:test :lab:ml-assist:test --stacktrace
      - name: Verify replica source contract and reproducible trained model
        run: |
          python3 lab/beta/tools/test_production_replica.py
          python3 lab/ml-assist/tools/train_family_model.py --check
          python3 lab/ml-assist/tools/test_training.py
      - name: Build Masroof with integrated lab
        run: ./gradlew :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: masroof-lab-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-test-reports
          path: |
            lab/finance-core/build/reports/tests/
            lab/bank-engine/build/reports/tests/
            lab/ml-assist/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: lab-acceptance-evidence
          path: |
            lab/beta/ML_PROVENANCE_REPORT_AR.html
            lab/beta/PRODUCTION_REPLICA_REPORT_AR.html
            lab/beta/PRODUCTION_REPLICA_SOURCES.json
            lab/beta/FINAL_FILE_MANIFEST.json
            lab/beta/ENGINE_PARITY_DIFFERENCES.json
            lab/ml-assist/ML_SEED_EVALUATION.json
            lab/ml-assist/SEPARATION_REPORT_AR.html
            lab/ml-assist/tools/baseline-evaluation.json
            lab/ml-assist/tools/corpus-splits.json
            lab/ml-assist/evidence/
            lab/beta/replica-overlays/
            lab/beta/evidence/
